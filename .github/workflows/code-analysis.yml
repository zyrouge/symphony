name: Code Analysis

on:
    push:
        branches-ignore:
            - site
            - gh-pages
            - i18n-summary
            - dependabot/**
        paths:
            - app/**
            - core/**
            - i18n/**
            - gradle/**
    pull_request_target:
        types:
            - opened
            - edited
        paths:
            - app/**
            - core/**
            - i18n/**
            - gradle/**
    workflow_dispatch:

permissions: {}

jobs:
    build:
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request_target' || github.event.pull_request.draft == false

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  cache: npm

            - uses: actions/setup-java@v4
              with:
                  distribution: zulu
                  java-version: 25
                  cache: gradle

            - name: ☕ Cache provisioned JDKs
              uses: actions/cache@v4
              with:
                  path: ~/.gradle/jdks
                  key: gradle-jdks-${{ runner.os }}-${{ hashFiles('gradle/gradle-daemon-jvm.properties') }}
                  restore-keys: |
                      gradle-jdks-${{ runner.os }}-

            - name: 🚧 Do prerequisites
              run: npm ci

            - name: 🚧 Prebuild
              run: npm run prebuild

            - name: 🧪 Run unit tests
              run: |
                  chmod +x ./gradlew
                  ./gradlew :app:testDebugUnitTest :core:jvmTest

            - name: ✅ Verify unit test results
              run: |
                  python3 - <<'PY'
                  import sys
                  import xml.etree.ElementTree as ET
                  from pathlib import Path

                  required_suites = (
                      (
                          "SongTest",
                          Path(
                              "core/build/test-results/jvmTest/"
                              "TEST-io.github.zyrouge.symphony.services.groove.SongTest.xml"
                          ),
                      ),
                      (
                          "SimplePathTest",
                          Path(
                              "app/build/test-results/testDebugUnitTest/"
                              "TEST-io.github.zyrouge.symphony.utils.SimplePathTest.xml"
                          ),
                      ),
                      (
                          "DurationUtilsTest",
                          Path(
                              "app/build/test-results/testDebugUnitTest/"
                              "TEST-io.github.zyrouge.symphony.utils.DurationUtilsTest.xml"
                          ),
                      ),
                  )
                  counter_names = ("tests", "failures", "errors", "skipped")
                  aggregate = {name: 0 for name in counter_names}
                  diagnostics = []

                  for suite, path in required_suites:
                      if not path.is_file():
                          diagnostics.append(f"{suite}: missing file: {path}")
                          continue
                      try:
                          root = ET.parse(path).getroot()
                      except ET.ParseError as error:
                          diagnostics.append(
                              f"{suite}: malformed XML: {path.name}: {error}"
                          )
                          continue
                      except OSError as error:
                          diagnostics.append(
                              f"{suite}: unreadable XML: {path.name}: {error}"
                          )
                          continue
                      if root.tag != "testsuite":
                          diagnostics.append(
                              f"{suite}: malformed XML: {path.name}: "
                              f"expected <testsuite>, got <{root.tag}>"
                          )
                          continue
                      counts = {}
                      for counter_name in counter_names:
                          raw_value = root.get(counter_name)
                          if raw_value is None:
                              diagnostics.append(
                                  f"{suite}: missing attribute "
                                  f"'{counter_name}' in {path.name}"
                              )
                              continue
                          try:
                              counts[counter_name] = int(raw_value)
                          except ValueError:
                              diagnostics.append(
                                  f"{suite}: invalid {counter_name}="
                                  f"{raw_value!r} in {path.name}"
                              )
                      if len(counts) != len(counter_names):
                          continue
                      print(
                          f"{suite}: "
                          + ", ".join(
                              f"{name}={counts[name]}" for name in counter_names
                          )
                      )
                      for name in counter_names:
                          aggregate[name] += counts[name]
                      if counts["tests"] <= 0:
                          diagnostics.append(
                              f"{suite}: tests={counts['tests']} (expected > 0)"
                          )
                      for name in ("failures", "errors", "skipped"):
                          if counts[name] != 0:
                              diagnostics.append(
                                  f"{suite}: {name}={counts[name]} (expected 0)"
                              )

                  print(
                      "Aggregate: "
                      + ", ".join(
                          f"{name}={aggregate[name]}" for name in counter_names
                      )
                  )
                  if diagnostics:
                      for diagnostic in diagnostics:
                          print(f"ERROR: {diagnostic}", file=sys.stderr)
                      sys.exit(1)
                  PY

            - name: 🚨 Analyze code
              run: |
                  chmod +x ./gradlew
                  ./gradlew lintRelease
